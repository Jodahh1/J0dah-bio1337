<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Крестики-нолики · JODAH</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-field"></div>
<div class="game-wrap">
  <div class="game-top">
    <h1 class="page-title" style="font-size:20px;margin:0;">Крестики-нолики</h1>
    <div style="display:flex;gap:6px;">
      <span class="score-pill">Ты: <span id="wins">0</span></span>
      <span class="score-pill">Бот: <span id="losses">0</span></span>
      <span class="score-pill">Ничьи: <span id="draws">0</span></span>
    </div>
  </div>

  <div class="card game-stage">
    <div id="tttBoard"></div>
  </div>

  <p class="game-msg" id="msg">Ты играешь за ✕, бот — за ○. Твой ход первый.</p>
  <div class="foot-nav">
    <button class="btn" id="restartBtn" type="button">Заново</button>
    <a class="btn ghost" href="games.html">К играм</a>
  </div>
</div>
<script src="game-tictactoe.js"></script>
</body>
</html>
